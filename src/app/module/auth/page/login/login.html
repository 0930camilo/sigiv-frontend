<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 via-white to-gray-100 px-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl p-10 shadow-2xl border border-gray-100 relative overflow-hidden">
      <!-- Decoración de fondo -->
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-100 rounded-full opacity-50 blur-3xl"></div>
      <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-blue-50 rounded-full opacity-50 blur-3xl"></div>

      <div class="relative">
        <!-- Logo/Icon -->
        <div class="flex justify-center mb-8">
          <div class="w-20 h-20 bg-blue-600 rounded-2xl shadow-lg shadow-blue-200 flex items-center justify-center transform -rotate-3 hover:rotate-0 transition-transform duration-300">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
        </div>

        <!-- Title -->
        <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-2 tracking-tight">
          ¡Bienvenido de nuevo!
        </h2>
        <p class="text-gray-500 text-center mb-8 font-medium">
          Ingresa tus credenciales para continuar
        </p>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-100 rounded-xl flex items-center gap-3">
          <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <p class="text-red-600 text-sm font-semibold">{{ errorMessage }}</p>
        </div>

        <!-- Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <!-- Usuario Field -->
          <div>
            <label class="block text-gray-700 text-sm font-bold mb-2 ml-1">
              Usuario
            </label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <input
                type="text"
                formControlName="usuario"
                placeholder="Ingresa tu usuario"
                class="w-full bg-gray-50 text-gray-900 placeholder-gray-400 rounded-xl pl-12 pr-4 py-4 border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all font-medium"
              />
            </div>
          </div>

          <!-- Contraseña Field -->
          <div>
            <div class="flex justify-between items-center mb-2 ml-1">
              <label class="block text-gray-700 text-sm font-bold">
                Contraseña
              </label>
            </div>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <svg class="w-5 h-5 text-gray-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input
                type="password"
                formControlName="clave"
                placeholder="••••••••"
                class="w-full bg-gray-50 text-gray-900 placeholder-gray-400 rounded-xl pl-12 pr-4 py-4 border border-gray-200 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all font-medium"
              />
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="loading || loginForm.invalid"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 disabled:cursor-not-allowed text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center text-lg"
          >
            <span *ngIf="!loading">Acceder al Sistema</span>
            <span *ngIf="loading" class="flex items-center">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Autenticando...
            </span>
          </button>
        </form>

        <!-- Footer Links -->
        <div class="mt-8 flex flex-col gap-4 items-center">
          <p class="text-gray-600 font-medium">
            ¿No tienes una cuenta?
            <a routerLink="/register" class="text-blue-600 hover:text-blue-700 font-bold ml-1">Regístrate aquí</a>
          </p>
          <a routerLink="/" class="text-gray-400 hover:text-gray-600 font-bold flex items-center gap-2 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Volver al inicio
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
