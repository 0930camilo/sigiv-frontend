<!-- Botón Flotante -->
<div class="fixed bottom-6 right-6 z-[60]">
  <button
    (click)="toggleCalculadora()"
    class="w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-2xl flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95 border-4 border-white"
  >
    <svg *ngIf="!isOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
    </svg>
    <svg *ngIf="isOpen" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Panel de la Calculadora -->
  <div
    *ngIf="isOpen"
    class="absolute bottom-20 right-0 w-80 bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden animate-slideUp"
  >
    <!-- Header -->
    <div class="bg-blue-600 p-4 text-white">
      <h3 class="font-bold flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        Calculadora Rápida
      </h3>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-gray-100">
      <button
        (click)="setTab('porcentaje')"
        [class.text-blue-600]="activeTab === 'porcentaje'"
        [class.border-blue-600]="activeTab === 'porcentaje'"
        class="flex-1 py-3 text-xs font-bold uppercase tracking-wider border-b-2 transition-colors hover:bg-gray-50"
      >
        Porcentaje
      </button>
      <button
        (click)="setTab('regla')"
        [class.text-blue-600]="activeTab === 'regla'"
        [class.border-blue-600]="activeTab === 'regla'"
        class="flex-1 py-3 text-xs font-bold uppercase tracking-wider border-b-2 transition-colors hover:bg-gray-50"
      >
        Regla de 3
      </button>
    </div>

    <!-- Contenido -->
    <div class="p-4 space-y-4">

      <!-- Tab Porcentaje -->
      <div *ngIf="activeTab === 'porcentaje'" class="space-y-4 animate-fadeIn">
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-4">
          <div>
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1.5 ml-1">¿Cuánto es el...</label>
            <div class="relative">
              <input
                type="number"
                [(ngModel)]="porcentajeP"
                class="w-full pl-3 pr-10 py-2.5 bg-white border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all font-semibold"
                placeholder="Ej: 15"
              />
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">%</span>
            </div>
          </div>

          <div class="flex items-center justify-center text-gray-300 font-bold text-xs uppercase italic">de este valor</div>

          <div>
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1.5 ml-1">Monto Base</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
              <input
                type="number"
                [(ngModel)]="valorP"
                class="w-full pl-7 pr-3 py-2.5 bg-white border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all font-semibold"
                placeholder="Ej: 1500.00"
              />
            </div>
          </div>
        </div>

        <button
          (click)="calcularPorcentaje()"
          [disabled]="loading"
          class="w-full py-2.5 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 transition-all shadow-md active:scale-95 disabled:opacity-50"
        >
          <span *ngIf="!loading">Calcular Porcentaje</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Procesando...
          </span>
        </button>

        <div *ngIf="resultadoP !== null" class="mt-4 p-4 bg-green-50 border border-green-100 rounded-xl shadow-inner animate-bounceIn">
          <div class="flex justify-between items-center mb-1">
            <p class="text-[10px] font-bold text-green-600 uppercase">Resultado Calculado</p>
            <span class="px-2 py-0.5 bg-green-200 text-green-700 rounded text-[9px] font-black">{{ porcentajeP }}%</span>
          </div>
          <p class="text-2xl font-black text-green-700 leading-none">
            <span class="text-sm align-top mr-1">$</span>{{ resultadoP | number:'1.0-4':'es-CO' }}
          </p>
        </div>
      </div>

      <!-- Tab Regla de Tres -->
      <div *ngIf="activeTab === 'regla'" class="space-y-4 animate-fadeIn">
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 space-y-3">
          <!-- Ejemplo explicativo -->
          <div class="px-2 py-1 bg-blue-50 rounded-lg border border-blue-100">
            <p class="text-[9px] text-blue-700 leading-tight">
              <span class="font-bold">Ejemplo:</span> Si <span class="font-bold">5kg</span> cuestan <span class="font-bold">$10.00</span>, ¿cuánto cuestan <span class="font-bold">8kg</span>?
            </p>
          </div>

          <div class="flex items-center gap-3">
            <div class="flex-1">
              <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Si este valor...</label>
              <div class="relative">
                <input type="number" [(ngModel)]="valorA" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all font-semibold" placeholder="Ej: 5 (kg)">
              </div>
            </div>
            <div class="mt-5 text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </div>
            <div class="flex-1">
              <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Equivale a...</label>
              <div class="relative">
                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-[10px] font-bold">$</span>
                <input type="number" [(ngModel)]="valorB" class="w-full pl-5 pr-2 py-2 bg-white border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all font-semibold" placeholder="10.00">
              </div>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <div class="flex-1">
              <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Entonces este...</label>
              <div class="relative">
                <input type="number" [(ngModel)]="valorC" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all font-semibold" placeholder="Ej: 8 (kg)">
              </div>
            </div>
            <div class="mt-5 text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center pt-4">
              <span class="text-[9px] font-bold text-blue-600 uppercase">Resultado</span>
              <div class="h-9 flex items-center justify-center">
                <span *ngIf="resultadoR === null" class="text-gray-300 font-bold italic">?</span>
                <div *ngIf="resultadoR !== null" class="flex items-center text-blue-700 font-black animate-bounceIn">
                  <span class="text-xs mr-0.5">$</span>
                  <span class="text-lg">{{ resultadoR | number:'1.0-2':'es-CO' }}</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button
          (click)="calcularRegla()"
          [disabled]="loading"
          class="w-full py-2.5 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 transition-all shadow-md active:scale-95 disabled:opacity-50"
        >
          <span *ngIf="!loading">Calcular</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Procesando...
          </span>
        </button>
      </div>

      <!-- Error -->
      <div *ngIf="error" class="p-2 text-center text-xs text-red-600 font-bold bg-red-50 rounded-lg">
        {{ error }}
      </div>
    </div>
  </div>
</div>
